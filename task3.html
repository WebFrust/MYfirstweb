<!DOCTYPE html>
<html lang="en">
<head>
    <title>Continental Hotel Reservation Form</title>
</head>
<body bgcolor="white">
    <table border="1" cellpadding="15" cellspacing="5" width="500" align="center" bgcolor="#d0e4f5" bordercolor="#004080">
        <tr>
            <td>
                <h2 align="center"><font color="#cc0000" face="Arial">Continental Hotel Reservation Form</font></h2>

                <form>
                    <table border="1" cellpadding="8" cellspacing="0" width="100%" bgcolor="#cce6ff" bordercolor="#004080">
                        <tr>
                            <td align="right"><b><font face="Arial" color="#002060">Name</font></b></td>
                            <td><input type="text" placeholder="Enter your name" size="35"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><font face="Arial" color="#002060">Email</font></b></td>
                            <td><input type="text" value="info@continental.pk" size="35"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><font face="Arial" color="#002060">Mobile No</font></b></td>
                            <td><input type="text" placeholder="Enter your cell number" size="35"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><font face="Arial" color="#002060">Arrival Time</font></b></td>
                            <td><input type="text" placeholder="Enter your arrival time" size="35"></td>
                        </tr>
                        <tr>
                            <td align="right"><b><font face="Arial" color="#002060">Departure</font></b></td>
                            <td>
                                <input type="text" size="14">
                                <input type="text" size="14">
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="top"><b><font face="Arial" color="#002060">Room Type</font></b></td>
                            <td>
                                <font face="Arial">
                                    <input type="radio" name="room"> Single
                                    <input type="radio" name="room"> Double <br>
                                    <input type="radio" name="room"> Presidential Suite
                                </font>
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="top"><b><font face="Arial" color="#002060">Preferences</font></b></td>
                            <td>
                                <font face="Arial">
                                    <input type="checkbox"> Non-Smoking <br>
                                    <input type="checkbox"> Internet <br>
                                    <input type="checkbox"> Firm Mattress
                                </font>
                            </td>
                        </tr>
                        <tr>
                            <td align="right" valign="top"><b><font face="Arial" color="#002060">Mode of Payment</font></b></td>
                            <td>
                                <font face="Arial">
                                    <input type="checkbox"> Cash
                                    <input type="checkbox"> Check <br>
                                    <input type="checkbox"> Credit Card
                                    <select>
                                        <option>Select Card</option>
                                        <option>Visa</option>
                                        <option>Mastercard</option>
                                    </select>
                                </font>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Send Data">
                            </td>
                        </tr>
                    </table>
                </form>

            </td>
        </tr>
    </table>
</body>
</html>
